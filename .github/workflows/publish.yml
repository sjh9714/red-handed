name: publish

# Publishing happens here rather than from a laptop, through npm's OIDC trusted
# publishing. There is no token anywhere: GitHub proves to npm that this
# workflow, in this repository, is what asked to publish. Nothing to store,
# nothing to rotate, nothing to leak.
#
# Push a tag that matches the version in package.json:
#
#   git tag v0.1.3 && git push origin v0.1.3

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      # prepublishOnly runs build and test again, but a failure here is cheaper
      # to read than one buried in the publish step.
      - run: npm run typecheck
      - run: npm test

      # The tag and the manifest have to agree, or the tag is lying about what
      # was published.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm publish --access public
